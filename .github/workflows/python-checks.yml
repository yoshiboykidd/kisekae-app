name: Python checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini SDK
        run: python -m pip install --upgrade pip google-genai
      - name: Compile Python files
        run: python -m compileall -q app.py gemini_image.py logic_kisekae.py logic_flatlay.py logic_dx.py tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
